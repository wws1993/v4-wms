services:
  web:
    image: nginx:alpine
    container_name: wms-web
    ports:
      # 主机 80 已被占用，改映射 8081；域名访问需在占用 80 的反代里转发到本容器
      - "8081:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
