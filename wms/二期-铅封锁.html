<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WMS 运输监控原型</title>
<style>
  :root{
    --side-bg:#1f2329; --side-bg-2:#191d21; --side-text:#b7bdc6; --side-dim:#7d848e;
    --active-bg:rgba(184,146,79,.18); --active-text:#e0bd76;
    --bg:#f4f5f6; --card:#fff; --border:#e6e7e9; --border-2:#eceef0;
    --text:#26292e; --text-2:#5f6670; --text-3:#9aa1a9;
    --accent:#a8843f; --accent-hover:#937336; --accent-soft:#f3ead8;
    --green:#2f9e63; --green-soft:#e6f3ec;
    --orange:#c07a2e; --orange-soft:#f8eee1;
    --gray:#8a9099; --gray-soft:#eef0f2;
    --red:#d0605f;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    background:var(--bg);color:var(--text);font-size:13.5px;line-height:1.6;
    font-variant-numeric:tabular-nums;
  }
  a{color:inherit;text-decoration:none;}
  .app{display:flex;min-width:1180px;min-height:100vh;}

  /* ===== 侧边栏 ===== */
  .sidebar{width:220px;flex:0 0 220px;background:var(--side-bg);color:var(--side-text);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .logo{display:flex;align-items:center;gap:10px;padding:18px 18px;font-weight:700;font-size:16px;color:#fff;}
  .logo .mark{width:26px;height:26px;border-radius:6px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;}
  .nav-group{padding:6px 0;}
  .nav-group-title{display:flex;align-items:center;gap:8px;padding:9px 18px;font-size:12px;color:var(--side-dim);cursor:pointer;user-select:none;}
  .nav-group-title .caret{margin-left:auto;transition:transform .15s;}
  .nav-group.collapsed .caret{transform:rotate(-90deg);}
  .nav-group.collapsed .nav-items{display:none;}
  .nav-items{list-style:none;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 18px 9px 30px;cursor:pointer;color:var(--side-text);font-size:13.5px;border-left:3px solid transparent;}
  .nav-item svg{width:15px;height:15px;flex:0 0 15px;stroke:currentColor;}
  .nav-item:hover{background:rgba(255,255,255,.05);}
  .nav-item.active{background:var(--active-bg);color:var(--active-text);border-left-color:var(--accent);}
  .nav-badge{margin-left:auto;font-size:11px;background:rgba(184,146,79,.25);color:var(--active-text);padding:1px 7px;border-radius:9px;}

  /* ===== 主区 ===== */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{background:var(--card);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:12px;}
  .crumb{font-size:12.5px;color:var(--text-3);}
  .crumb b{color:var(--text-2);font-weight:600;}
  .topbar .spacer{flex:1;}
  .user{display:flex;align-items:center;gap:8px;color:var(--text-2);font-size:12.5px;}
  .avatar{width:28px;height:28px;border-radius:50%;background:var(--gray-soft);display:flex;align-items:center;justify-content:center;color:var(--text-2);font-size:12px;}

  .content{padding:20px 24px;}
  .page-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .page-head h1{font-size:18px;font-weight:600;}
  .page-head .sub{font-size:12.5px;color:var(--text-3);}

  /* ===== 卡片 / 筛选 ===== */
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;}
  .filter-bar{padding:16px 18px;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end;border-bottom:1px solid var(--border-2);}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:12px;color:var(--text-3);}
  .field input,.field select{height:34px;padding:0 10px;border:1px solid var(--border);border-radius:7px;font-size:13px;color:var(--text);background:#fff;min-width:150px;outline:none;}
  .field input:focus,.field select:focus{border-color:var(--accent);}
  .btn{height:34px;padding:0 16px;border-radius:7px;border:1px solid var(--border);background:#fff;color:var(--text-2);font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-hover);color:#fff;}
  .btn-sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:6px;}
  .link{color:var(--accent);cursor:pointer;font-size:12.5px;}
  .link:hover{text-decoration:underline;}
  .link.danger{color:var(--red);}

  /* ===== 表格 ===== */
  .table-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{background:#f7f8f9;color:var(--text-2);font-weight:600;text-align:left;padding:11px 14px;white-space:nowrap;border-bottom:1px solid var(--border);}
  tbody td{padding:12px 14px;border-bottom:1px solid var(--border-2);white-space:nowrap;color:var(--text);}
  tbody tr:hover{background:#faf8f3;}
  .cell-sub{font-size:12px;color:var(--text-3);}
  .tag{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:20px;font-size:12px;}
  .tag.online{background:var(--green-soft);color:var(--green);}
  .tag.offline{background:var(--gray-soft);color:var(--gray);}
  .tag.active{background:var(--orange-soft);color:var(--orange);}
  .tag.idle{background:var(--gray-soft);color:var(--gray);}
  .tag.mode{background:var(--accent-soft);color:var(--accent);}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
  .dot.on{background:var(--green);} .dot.off{background:var(--gray);}

  /* ===== 分页 ===== */
  .pager{display:flex;align-items:center;gap:8px;padding:14px 18px;justify-content:flex-end;font-size:12.5px;color:var(--text-2);}
  .pager button{min-width:30px;height:30px;border:1px solid var(--border);background:#fff;border-radius:6px;cursor:pointer;color:var(--text-2);}
  .pager button.cur{background:var(--accent);color:#fff;border-color:var(--accent);}
  .pager button:disabled{opacity:.4;cursor:not-allowed;}

  /* ===== 弹窗 ===== */
  .mask{position:fixed;inset:0;background:rgba(20,22,25,.45);display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal{background:#fff;border-radius:12px;width:680px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;}
  .modal.wide{width:860px;}
  .modal-head{padding:16px 20px;border-bottom:1px solid var(--border-2);display:flex;align-items:center;}
  .modal-head h3{font-size:15.5px;font-weight:600;}
  .modal-head .x{margin-left:auto;cursor:pointer;color:var(--text-3);font-size:20px;line-height:1;}
  .modal-body{padding:20px;overflow-y:auto;}
  .modal-foot{padding:14px 20px;border-top:1px solid var(--border-2);display:flex;justify-content:flex-end;gap:10px;}

  .readonly-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 18px;margin-bottom:16px;}
  .ro{font-size:12.5px;}
  .ro .k{color:var(--text-3);margin-bottom:3px;}
  .ro .v{color:var(--text);font-weight:500;}
  .ro .v.readonly{color:var(--text-2);background:#f4f5f6;padding:6px 10px;border-radius:6px;}

  .car-card{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;}
  .car-card .car-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-weight:600;}
  .seal-row{display:flex;gap:10px;align-items:center;margin-bottom:8px;}
  .seal-row input{flex:1;}
  .mini-table{width:100%;font-size:12.5px;}
  .mini-table th{background:#f7f8f9;padding:8px 10px;text-align:left;color:var(--text-2);font-weight:600;}
  .mini-table td{padding:8px 10px;border-bottom:1px solid var(--border-2);}

  /* 地图占位 */
  .map-box{height:340px;border:1px dashed #c9cdd4;border-radius:10px;background:
    linear-gradient(0deg,rgba(184,146,79,.04),rgba(184,146,79,.04)),#f7f8f9;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text-3);text-align:center;padding:20px;}
  .map-box svg{width:42px;height:42px;stroke:#c2a878;}
  .replay-bar{margin-top:14px;display:flex;align-items:center;gap:14px;}
  .replay-bar input[type=range]{flex:1;accent-color:var(--accent);}
  .speed-group{display:flex;gap:4px;}
  .speed-group button{height:28px;padding:0 10px;border:1px solid var(--border);background:#fff;border-radius:6px;cursor:pointer;font-size:12px;color:var(--text-2);}
  .speed-group button.cur{background:var(--accent);color:#fff;border-color:var(--accent);}
  .timeline-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--text-3);margin-top:6px;}

  .toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:#26292e;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;}
  .toast.show{opacity:1;}
  .empty{padding:40px;text-align:center;color:var(--text-3);font-size:13px;}
</style>
</head>

 * 工具
 * ============================================================ */
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._timer); t._timer=setTimeout(()=>t.classList.remove('show'),1800);
}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function dur(appoint, sign){
  if(!sign) return '<span class="tag active">在途</span>';
  const a=new Date(appoint.replace(/-/g,'/')), b=new Date(sign.replace(/-/g,'/'));
  const h=Math.round((b-a)/3600000);
  if(h<24) return h+' 小时';
  return Math.floor(h/24)+' 天 '+(h%24)+' 小时';
}

/* ============================================================
 * 分页器
 * ============================================================ */
function pager(total, routeKey, cur){
  const pages=Math.max(1,Math.ceil(total/state.perPage));
  let btns='';
  for(let i=1;i<=pages;i++) btns+=`<button class="${i===cur?'cur':''}" data-p="${i}">${i}</button>`;
  return `<div class="pager">共 ${total} 条 <button data-pg="prev" ${cur<=1?'disabled':''}>‹</button>${btns}<button data-pg="next" ${cur>=pages?'disabled':''}>›</button></div>`;
}
function bindPager(routeKey){
  const box=document.querySelector(`#view [data-pager]`);
  if(!box) return;
  box.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    let p=b.dataset.p||(b.dataset.pg==='prev'?state.page[routeKey]-1:state.page[routeKey]+1);
    state.page[routeKey]=Math.max(1,p); render();
  });
}

        <div class="ro"><div class="k">报关单号</div><div class="v readonly">${esc(bgNo)}</div></div>
        <div class="ro"><div class="k">货运方式（WMS带出）</div><div class="v readonly">${esc(mode||'—')}</div></div>
        <div class="ro"><div class="k">集装箱柜数（WMS带出）</div><div class="v readonly">${box||'—'}</div></div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin:6px 0 8px;">
        <div style="font-size:13px;font-weight:600;">运输车辆（${cars.length}）</div>
        <button class="btn btn-sm" data-addcar>+ 添加车辆</button>
      </div>
      ${carInputs||'<div class="empty" style="padding:16px;">暂无车辆，请添加运输车辆。</div>'}`;
  }

  function renderModal(){
    document.getElementById('modal-root').innerHTML=`
      <div class="mask" style="display:flex;">
        <div class="modal">
          <div class="modal-head"><h3>运输方案 · ${esc(bgNo)}</h3><span class="x" data-close>×</span></div>
          <div class="modal-body" id="plan-body">${bodyHTML()}</div>
          <div class="modal-foot">
            <button class="btn" data-close>取消</button>
            <button class="btn btn-primary" data-save>保存方案</button>
          </div>
        </div>
      </div>`;
    bindPlanEvents();
  }

  function bindPlanEvents(){
    const root=document.getElementById('modal-root');
    root.querySelector('[data-close]').addEventListener('click',closeModal);
    root.onclick=e=>{
      const t=e.target;
      if(!(t instanceof Element))return;
      if(t.matches('[data-addcar]')){cars.push({plate:"",seals:[""]});renderModal();}
      if(t.matches('[data-addseal]')){cars[+t.dataset.addseal].seals.push("");renderModal();}
      if(t.matches('[data-rmseal]')){
        const [carIndex,sealIndex]=t.dataset.rmseal.split('-').map(Number);
        cars[carIndex].seals.splice(sealIndex,1);renderModal();
      }
      if(t.matches('[data-delcar]')){cars.splice(+t.dataset.delcar,1);renderModal();}
      if(t.matches('[data-save]'))save();
    };
    root.oninput=e=>{
      const t=e.target;
      if(!(t instanceof HTMLInputElement))return;
      if(t.dataset.cplate!==undefined)cars[+t.dataset.cplate].plate=t.value;
      if(t.dataset.sealCar!==undefined){
        cars[+t.dataset.sealCar].seals[+t.dataset.sealIndex]=t.value;
      }
    };
  }

  function save(){
    if(!cars.length){toast('请至少绑定一辆车');return;}
    for(let i=0;i<cars.length;i++){
      if(!cars[i].plate.trim()){toast(`请填写第 ${i+1} 辆车的车牌号`);return;}
      if(!cars[i].seals.length){toast(`请为第 ${i+1} 辆车添加铅封锁`);return;}
      for(let j=0;j<cars[i].seals.length;j++){
        if(!cars[i].seals[j].trim()){toast(`请填写第 ${i+1} 辆车的第 ${j+1} 个铅封锁编号`);return;}
      }
    }
    const savedCars=cars.map(c=>({plate:c.plate.trim(),seals:c.seals.map(s=>s.trim())}));
    let p=DB.plans.find(x=>x.bg===bgNo);
    if(p){p.cars=savedCars;}
    else{
      DB.plans.push({bg:bgNo,bl:inv.bl,vessel:inv.vessel,consignor:inv.consignor,mode:inv.mode,box:Number(inv.box)||0,
        appoint:"待预约",sign:"",cars:savedCars});
    }
    closeModal();toast('方案已保存（原型本地状态）');render();
  }
  renderModal();
}

/* ============================================================
 * 弹窗：实时位置 / 轨迹回放（天地图占位）
 * ============================================================ */
function openMapModal(kind, target){
  const isReplay=kind==='replay';
  const meta = isReplay
    ? `<div class="timeline-meta"><span>预约 2026-10-25 08:00</span><span>时长约 28.5 小时（最长支持 3–4 天）</span><span>签收 2026-10-26 12:30</span></div>`
    : `<div class="timeline-meta"><span>目标：${esc(target)}</span><span>最后定位 2026-10-26 14:58:10</span><span class="tag online">在线</span></div>`;
  document.getElementById('modal-root').innerHTML=`
    <div class="mask" style="display:flex;">
      <div class="modal wide">
        <div class="modal-head"><h3>${isReplay?'轨迹回放':'实时位置'} · ${esc(target)}</h3><span class="x" data-close>×</span></div>
        <div class="modal-body">
          <div class="map-box">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
            <div><b>天地图容器</b>（申请开发 Key 后在此渲染底图与轨迹线）</div>
            <div style="font-size:12px;">原型阶段以占位框表示，不接入真实地图瓦片</div>
          </div>
          ${isReplay?`
          <div class="replay-bar">
            <button class="btn btn-sm" id="playBtn">▶ 播放</button>
            <div class="speed-group"><button class="cur">1x</button><button>2x</button><button>4x</button></div>
            <input type="range" min="0" max="100" value="32">
            <span class="cell-sub" id="rpTime">09:12 / 28:30:00</span>
          </div>${meta}`:`<div style="margin-top:12px;">${meta}</div>`}
        </div>
        <div class="modal-foot"><button class="btn" data-close>关闭</button></div>
      </div>
    </div>`;
  const root=document.getElementById('modal-root');
  root.querySelector('[data-close]').addEventListener('click',closeModal);
  const pb=root.querySelector('#playBtn');
  if(pb){pb.addEventListener('click',()=>{
    const playing=pb.dataset.on==='1';
    pb.dataset.on=playing?'0':'1';
    pb.textContent=playing?'▶ 播放':'⏸ 暂停';
    toast(playing?'已暂停':'开始回放（原型仅演示控件）');
  });}
  root.querySelectorAll('.speed-group button').forEach(b=>b.addEventListener('click',()=>{
    root.querySelectorAll('.speed-group button').forEach(x=>x.classList.remove('cur'));b.classList.add('cur');
  }));
}

function closeModal(){document.getElementById('modal-root').innerHTML='';document.getElementById('mask').style.display='none';}
document.getElementById('mask').addEventListener('click',closeModal);

/* ============================================================
 * 渲染主流程
 * ============================================================ */
function render(){
  const r=state.route;
  const meta=ROUTES[r]||ROUTES['/inbound'];
  document.getElementById('crumb').innerHTML=`首页 / <b>${esc(meta.title)}</b>`;
  const view=document.getElementById('view');
  let html='';
  if(r==='/devices')html=viewDevices();
  else if(r==='/vehicles')html=viewVehicles();
  else if(r==='/records')html=viewRecords();
  else if(r==='/alerts')html=viewAlerts();
  else html=viewInbound();
  view.innerHTML=html;
  renderNav();
  bindCommon();
  const key=r==='/devices'?'devices':r==='/vehicles'?'vehicles':r==='/records'?'records':r==='/alerts'?'alerts':'inbound';
  bindPager(key);
}

function bindCommon(){
  const view=document.getElementById('view');
  // 回填筛选值（input / select 统一取本地状态）
  const fk=currentFilterKey();
  view.querySelectorAll('[data-f]').forEach(el=>{el.value=state.filters[fk][el.dataset.f]||'';});
  // 筛选
  view.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>{
    const key=currentFilterKey();
    view.querySelectorAll('[data-f]').forEach(el=>{state.filters[key][el.dataset.f]=el.value;});
    state.page[key]=1;render();toast('查询完成');
  }));
  view.querySelectorAll('[data-refresh]').forEach(b=>b.addEventListener('click',()=>toast('已手动刷新（原型不重新请求）')));
  // 行操作
  view.querySelectorAll('[data-plan]').forEach(el=>el.addEventListener('click',()=>openPlanModal(el.dataset.plan)));
  view.querySelectorAll('[data-live]').forEach(el=>el.addEventListener('click',()=>openMapModal('live',el.dataset.live)));
  view.querySelectorAll('[data-track]').forEach(el=>el.addEventListener('click',()=>openMapModal('replay',el.dataset.track)));
  view.querySelectorAll('[data-replay]').forEach(el=>el.addEventListener('click',()=>openMapModal('replay',el.dataset.replay)));
}
function currentFilterKey(){
  const r=state.route;
  return r==='/devices'?'devices':r==='/vehicles'?'vehicles':r==='/records'?'records':r==='/alerts'?'alerts':'inbound';
}

function route(){
  let r=location.hash.replace('#','')||'/inbound';
  if(!ROUTES[r])r='/inbound';
  state.route=r;state.page[currentFilterKey()]=1;render();
}
window.addEventListener('hashchange',route);
route();
</script>
